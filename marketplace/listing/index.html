<!doctype html>
<html lang="en" data-marketplace-runtime="marketplace-detail.js?v=1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D2540">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="HerdHarbor Marketplace listing private Owner preview.">
  <link rel="canonical" href="https://herdharbor.com/marketplace/listing/">
  <title>Marketplace Listing — HerdHarbor</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../marketplace.css?v=4">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="/" aria-label="HerdHarbor home"><img src="../../assets/herdharbor-icon.png" alt=""><span>HerdHarbor</span></a>
      <nav class="site-nav open" aria-label="Marketplace navigation">
        <a href="/marketplace/">Browse</a>
        <a href="/marketplace/#my-listings">My Listings</a>
        <a href="/marketplace/#seller-profile">Seller Profile</a>
        <a class="button button-small" href="https://app.herdharbor.com/">Open HerdHarbor</a>
      </nav>
    </div>
  </header>
  <main id="main" class="marketplace-main">
    <div class="container marketplace-shell">
      <section class="marketplace-gate" id="marketplace-access-shell" aria-live="polite">
        <h1>Marketplace listing</h1>
        <p class="marketplace-gate-status" id="marketplace-gate-status">Checking secure Owner preview access…</p>
        <form class="marketplace-auth-form" id="marketplace-auth-form" hidden>
          <label>HerdHarbor account email<input id="marketplace-email" type="email" autocomplete="username" required></label>
          <label>Password<input id="marketplace-password" type="password" autocomplete="current-password" required></label>
          <button class="button" type="submit">Sign in to private preview</button>
        </form>
        <div class="marketplace-gate-actions" id="marketplace-gate-actions" hidden>
          <a class="button button-secondary button-small" href="/marketplace/">Back to Marketplace</a>
          <button class="button button-secondary button-small" id="marketplace-sign-out" type="button" hidden>Sign out</button>
        </div>
      </section>
      <div id="marketplace-owner-root" hidden></div>
    </div>
  </main>
  <script src="../../vendor/supabase-2.111.0.js"></script>
  <script src="../marketplace-gate.js?v=2"></script>
</body>
</html>
